<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070709" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="description"
      content="pMusic — Reproductor de música multiplataforma con Liquid Glass, Modo Sesión DJ AutoMix, catálogo completo y sincronización PC y móvil"
    />
    <title>pMusic</title>
    <style>
      #pm-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(circle at 50% 42%, rgba(168, 85, 247, 0.22) 0%, rgba(250, 35, 59, 0.08) 38%, #070709 75%),
          #070709;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 380ms cubic-bezier(0.22, 1, 0.36, 1), transform 380ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #pm-boot-splash.pm-splash-hide {
        opacity: 0;
        transform: scale(1.035);
        pointer-events: none;
      }
      .pm-splash-mark {
        display: flex;
        align-items: center;
        gap: 14px;
        animation: pmSplashPulse 1.6s ease-in-out infinite alternate;
      }
      .pm-splash-badge {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(135deg, #fa233b 0%, #a855f7 100%);
        box-shadow: 0 18px 46px rgba(168, 85, 247, 0.36);
      }
      .pm-splash-bar {
        width: 128px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }
      .pm-splash-bar::after {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.5), #ffffff);
        animation: pmSplashLoad 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes pmSplashPulse {
        from { transform: scale(0.985); opacity: 0.9; }
        to { transform: scale(1.015); opacity: 1; }
      }
      @keyframes pmSplashLoad {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body class="antialiased selection:bg-white/20 bg-[#070709]">
    <div id="pm-boot-splash" aria-hidden="true">
      <div class="pm-splash-mark">
        <span class="pm-splash-badge">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M9 17.5V6.6a1.5 1.5 0 0 1 1.14-1.46l8-2A1.5 1.5 0 0 1 20 4.6V15.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6.5" cy="17.5" r="2.5" fill="#ffffff"/>
            <circle cx="17.5" cy="15.5" r="2.5" fill="#ffffff"/>
          </svg>
        </span>
        <span style="font-size: 32px; font-weight: 800; letter-spacing: -0.04em;">pMusic</span>
      </div>
      <div class="pm-splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

    <style>
      html, body {
        background-color: #000000;

      #pm-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #000000;
        color: #ffffff;
        transition: opacity 280ms ease-out;
      }
      #pm-boot-splash.pm-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      .pm-splash-loader {
        width: 88px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
      }
      .pm-splash-loader::after {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        animation: pmSplashSweep 1.05s ease-in-out infinite;
      }
      @keyframes pmSplashSweep {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
      #pm-splash-status {
        display: none;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.78);
        text-align: center;
        margin-top: -6px;
      }
      #pm-splash-update-bar {
        display: none;
        width: 172px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
        margin-top: -10px;
      }
      #pm-splash-update-fill {
        width: 8%;
        height: 100%;
        border-radius: 999px;
        background: #ffffff;
        transition: width 180ms ease-out;
      }

appId: es.pmusic.desktop
productName: pMusic
executableName: pmusic
electronVersion: "45.4.1"
asar: false
protocols:
  - name: pMusic
    schemes:
      - pmusic
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/main.cjs
  - dist-electron/preload.cjs
  - package.json
  - "!**/node_modules/**"
  - "!**/design/apple-design-skill/**"
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: pMusic-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: pMusic
  uninstallDisplayName: pMusic
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
  language: "3082"
  runAfterFinish: true
portable:
  artifactName: pMusic-Portable-${version}.${ext}
  splashImage: build/portableSplash.bmp
linux:
  icon: build/icon.png
  category: Audio
  target:
    - dir
